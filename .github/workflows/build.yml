name: Build
env:
  CARGO_TERM_COLOR: always
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: ${{ steps.paths.outputs.run_validation }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: ${{ github.token }}
        CI_INCLUDE_PATHS: '["**"]'
        CI_IGNORE_PATHS: '[]'
      run: python3 .github/scripts/ci_changes.py
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy
    - name: Run tests
      uses: actions-rs/cargo@v1
      with:
        command: test
        args: --features github-ci --no-fail-fast
      env:
        RUST_LOG: trace
        INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
        INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
    - name: Format
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy -- -Dwarnings
    needs:
    - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  ci_gate:
    name: CI (build.yml)
    if: ${{ !cancelled() }}
    needs:
    - ci_changes
    - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: ${{ toJSON(needs) }}
        CI_EXPECTED_JOBS: '["build"]'
      run: 'python3 -m unittest discover -s .github/scripts -p test_ci_contract.py

        python3 .github/scripts/ci_gate.py'
concurrency:
  group: pr-ci-build.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
'on':
  push: null
  pull_request:
    paths:
    - '**'
